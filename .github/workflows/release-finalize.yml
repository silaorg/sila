name: release-3-finalize

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g., desktop-v1.2.3)
        required: true
      latest:
        description: Mark as latest installer release (disable for front-end patches)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate assets and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
          MAKE_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ASSETS="$(gh release view "$TAG_NAME" --json assets --jq '[.assets[].name]')"
          jq -e --arg name "$TAG_NAME.zip" 'index($name) != null' <<< "$ASSETS"
          if [ "$MAKE_LATEST" = true ]; then
            for manifest in latest-mac.yml latest.yml latest-linux.yml latest-linux-arm64.yml; do
              jq -e --arg name "$manifest" 'index($name) != null' <<< "$ASSETS"
            done
          fi
          gh release edit "$TAG_NAME" --draft=false --prerelease=false --latest="$MAKE_LATEST"
